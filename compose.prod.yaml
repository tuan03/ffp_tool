services:
  app:
    image: ${DOCKER_IMAGE}
    container_name: ffp-tool-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3001"
    env_file:
      - .env
    volumes:
      - ./data:/app/.local-data
      - ./runtime:/app/.runtime
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
