# Nginx configuration for FFP Tool Web Client (Frontend Container)
# Serves React SPA & reverse-proxies APIs/WebSockets to the unified backend server

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $agent_server_scheme {
    default $scheme;
    http    http;
    https   https;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. Static SPA routing
    location / {
        auth_basic "FFP Tool";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /index.html;
    }

    # 2. Amazon Crawler Coordinator API & WebSocket -> server:8766
    location ^~ /api/v1/pinterest-assets/ {
        proxy_pass http://server:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Worker APIs must not fall through to SPA HTML; preserve Gateway authentication.
    location = /mcp/seo-worker {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_buffering off;
        proxy_read_timeout 60s;
        access_log off;
    }

    location ^~ /api/seo-agent/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_read_timeout 60s;
        access_log off;
    }

    location ^~ /seo-agent-pack/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Pipeline endpoints are private even though other Coordinator APIs are public.
    location ^~ /api/v1/internal/ {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND"}}';
    }

    location ~ ^/api/v1/(health|ready|crawler-metrics|agent-release|crawl-jobs|clients|worker|review-jobs|product-reviews|image-profiles)(/|$) {
        proxy_pass http://server:8766;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Search Console uses operator Authorization and OAuth state cookies.
    # Do not log request URLs: OAuth callback query strings contain credentials.
    location ^~ /api/seo-performance/ {
        auth_basic "FFP Tool";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        access_log off;
    }

    # Auto SEO durable review API -> Gateway
    location ^~ /api/seo-review/ {
        auth_basic "FFP Tool";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Pinterest cross-module handovers remain owned by the Gateway.
    location = /api/pinterest-pod/handover-seo {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /api/pinterest-pod/sync-shopify {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Pinterest owns auth, discovery, production, jobs, logs and assets.
    location ^~ /api/pinterest-pod/ {
        proxy_pass http://server:8768;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Only the authenticated extension channel bypasses the operator Gateway.
    location = /api/review-images/extension {
        proxy_pass http://server:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
        access_log off;
    }

    # Public liveness endpoint used by Docker and the host deployment check.
    location = /health {
        auth_basic off;
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Browser administration uses operator Basic Auth. Action and MCP clients keep
    # their independent Bearer authentication below.
    location ^~ /api/v1/gpt-seo/admin/ {
        auth_basic "FFP Tool";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/v1/gpt-seo/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /mcp/gpt-seo {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3. Core browser Gateway and Shopify APIs -> server:3001
    location ~ ^/api/(shopify|stores|auto-seo|proxy|review-images|amazon-reviews) {
        auth_basic "FFP Tool";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://server:3001;
        proxy_http_version 1.1;

        # WebSocket support if needed
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;

        # 60s timeout for OpenAI actions
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static assets cache (for React SPA static build files, after all API routes)
    location ~ ^/api/ {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND"}}';
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 4. Agent Crawler 1-Command Installer endpoints
    location = /install-agent.ps1 {
        default_type text/plain;
        try_files /scripts/install-agent.ps1 =404;
    }

    location = /install-agent.sh {
        default_type text/plain;
        try_files /scripts/install-agent.sh =404;
    }

    location = /cai-agent.bat {
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="cai-agent.bat"';
        return 200 '@echo off\r\nsetlocal\r\ntitle Cai Dat FFP Crawler Agent\r\nset "FFP_SERVER_URL=${agent_server_scheme}://${http_host}"\r\necho Dang cai FFP Crawler Agent tu %FFP_SERVER_URL%...\r\npowershell -NoProfile -ExecutionPolicy Bypass -Command "& ([scriptblock]::Create((Invoke-RestMethod %FFP_SERVER_URL%/install-agent.ps1)))"\r\nif errorlevel 1 echo Cai dat that bai. Vui long kiem tra ket noi va thu lai.\r\npause\r\n';
    }

    location = /update-agent.ps1 {
        default_type text/plain;
        try_files /scripts/update-agent.ps1 =404;
    }

    location = /uninstall-agent.ps1 {
        default_type text/plain;
        try_files /scripts/uninstall-agent.ps1 =404;
    }

    location = /ffp-crawler-agent.tar.gz {
        default_type application/gzip;
        add_header Content-Disposition "attachment; filename=ffp-crawler-agent.tar.gz";
        try_files /downloads/ffp-crawler-agent.tar.gz =404;
    }

    location = /ffp-crawler-agent.tar.gz.sha256 {
        default_type text/plain;
        try_files /downloads/ffp-crawler-agent.tar.gz.sha256 =404;
    }
}
