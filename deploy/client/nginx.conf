# Nginx configuration for FFP Tool Web Client (Frontend Container)
# Serves React SPA & reverse-proxies APIs/WebSockets to the unified backend server

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. Static SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 2. Amazon Crawler Coordinator API & WebSocket -> server:8766
    location ~ ^/api/v1/(crawl-jobs|clients|worker)/? {
        proxy_pass http://server:8766;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 3a. Specific Pinterest POD Handover & Sync routes -> server:3001 (Gateway)
    location ~ ^/api/pinterest-pod/(handover-seo|sync-shopify)(?:/|$) {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;

        # WebSocket support if needed
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 3b. Pinterest POD service -> server:8768 (all other Pinterest routes)
    location ~ ^/api/pinterest-pod/ {
        proxy_pass http://server:8768;
        proxy_http_version 1.1;

        # WebSocket support if needed
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 3c. Core Gateway & Shopify & Auto SEO & SEO Review & Custom GPT SEO APIs -> server:3001
    location ~ ^/(api/(shopify|stores|auto-seo|proxy|seo-review)|api/v1/gpt-seo|health) {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;

        # WebSocket support if needed
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;

        # 60s timeout for OpenAI actions
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 3d. Unhandled /api/ routes return JSON 404 instead of falling back to SPA index.html
    location ~ ^/api/ {
        default_type application/json;
        return 404 '{"success":false,"error":{"code":"NOT_FOUND","message":"API route not found"}}';
    }

    # 4. Agent Crawler 1-Command Installer endpoints
    location = /install-agent.ps1 {
        default_type text/plain;
        try_files /scripts/install-agent.ps1 =404;
    }

    location = /install-agent.sh {
        default_type text/plain;
        try_files /scripts/install-agent.sh =404;
    }

    location = /cai-agent.bat {
        default_type application/octet-stream;
        try_files /scripts/cai-agent.bat =404;
    }
}
