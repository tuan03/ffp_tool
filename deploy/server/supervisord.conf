[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:gateway]
command=node --import tsx gateway/server.ts
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:coordinator]
command=/opt/venv/bin/python -m uvicorn scripts.coordinator_app:create_app --factory --app-dir /app --host 0.0.0.0 --port 8766 --ws-max-size 8388608
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pinterest-pod]
command=/opt/venv/bin/python /app/src/modules/pinterest-pod/server/server.py
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pipeline-worker]
command=/app/deploy/server/run-pipeline-worker.sh
directory=/app
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
