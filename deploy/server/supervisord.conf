[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:gateway]
command=node --import tsx gateway/server.ts
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:coordinator]
command=/opt/venv/bin/python -m uvicorn engine.distributed.coordinator_server:app --app-dir /app/src/modules/amazon-crawler --host 0.0.0.0 --port 8766
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pinterest-pod]
command=/opt/venv/bin/python /app/src/modules/pinterest-pod/server/server.py
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pipeline-worker]
command=/app/deploy/server/run-pipeline-worker.sh
directory=/app
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
