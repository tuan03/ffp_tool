name: Build and Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Pre-deploy quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript types
        run: npm run typecheck

      - name: Run deployment contract tests
        run: node --test scripts/production-postgres.test.mjs scripts/production-search-console.test.mjs scripts/production-service-tokens.test.mjs scripts/restart-gpt-seo.test.mjs

      - name: Run MCP and Gateway core tests
        run: npx tsx --test gateway/__tests__/ads-intelligence-mcp.test.ts

  deploy:
    name: Deploy root Compose to VPS
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package tracked deployment source
        run: git ls-files -z | tar --null -czf ffp-tool-deploy.tar.gz --files-from -

      - name: Copy deployment source to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ffp-tool-deploy.tar.gz
          target: /tmp

      - name: Encode environment secrets
        id: prep
        env:
          RAW_ENV: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$RAW_ENV" ]; then
            echo "env_b64=$(printf '%s' "$RAW_ENV" | base64 -w 0)" >> "$GITHUB_OUTPUT"
          else
            echo "env_b64=" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the official three-container topology
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_DOMAIN: ${{ secrets.DOMAIN || 'ffp.b6-team.site' }}
          ENV_B64: ${{ steps.prep.outputs.env_b64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TARGET_DOMAIN,ENV_B64
          script: |
            set -Eeuo pipefail
            umask 077

            DEPLOY_DIR="/opt/ffp-tool"
            ARCHIVE="/tmp/ffp-tool-deploy.tar.gz"
            echo "=== [1/6] Preparing deployment directory at $DEPLOY_DIR ==="
            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown -R "$USER:$USER" "$DEPLOY_DIR"
            tar -xzf "$ARCHIVE" -C "$DEPLOY_DIR"
            rm -f "$ARCHIVE"
            cd "$DEPLOY_DIR"

            # Retire files left by either legacy production topology.
            rm -f compose.prod.yaml deploy/amazon-crawler-coordinator/docker-compose.yml .env.production.example

            echo "=== [2/6] Detecting client port ==="
            CLIENT_PORT=""
            if [ -f .env ]; then
              CLIENT_PORT=$(grep -E "^CLIENT_PORT=" .env 2>/dev/null | cut -d '=' -f2 | tr -d ' "' || true)
              if [ -z "$CLIENT_PORT" ]; then
                CLIENT_PORT=$(grep -E "^APP_PORT=" .env 2>/dev/null | cut -d '=' -f2 | tr -d ' "' || true)
              fi
            fi
            if [ -z "$CLIENT_PORT" ]; then
              CLIENT_PORT=$(python3 -c "import socket; print(next(p for p in range(3010, 4000) if socket.socket().connect_ex(('127.0.0.1', p)) != 0))" 2>/dev/null || echo "3010")
            fi
            echo "Using client port: $CLIENT_PORT"

            echo "=== [3/6] Applying production environment ==="
            EXISTING_GPT_SEO_ACTION_KEYS_JSON=""
            EXISTING_GPT_SEO_MCP_KEYS_JSON=""
            EXISTING_FFP_OPERATOR_USERNAME=""
            EXISTING_FFP_OPERATOR_PASSWORD=""
            EXISTING_STORE_ENV_FILE="$(mktemp)"
            EXISTING_DATABASE_ENV_FILE="$(mktemp)"
            EXISTING_SEARCH_CONSOLE_ENV_FILE="$(mktemp)"
            EXISTING_SERVICE_TOKEN_ENV_FILE="$(mktemp)"
            EXISTING_ADS_ENV_FILE="$(mktemp)"
            trap 'rm -f "$EXISTING_STORE_ENV_FILE" "$EXISTING_DATABASE_ENV_FILE" "$EXISTING_SEARCH_CONSOLE_ENV_FILE" "$EXISTING_SERVICE_TOKEN_ENV_FILE" "$EXISTING_ADS_ENV_FILE"' EXIT
            if [ -f .env ]; then
              EXISTING_GPT_SEO_ACTION_KEYS_JSON=$(sed -nE 's/^[[:space:]]*GPT_SEO_ACTION_KEYS_JSON=(.*)$/\1/p' .env | head -n 1 || true)
              EXISTING_GPT_SEO_MCP_KEYS_JSON=$(sed -nE 's/^[[:space:]]*GPT_SEO_MCP_KEYS_JSON=(.*)$/\1/p' .env | head -n 1 || true)
              EXISTING_FFP_OPERATOR_USERNAME=$(sed -nE 's/^[[:space:]]*FFP_OPERATOR_USERNAME=(.*)$/\1/p' .env | head -n 1 || true)
              EXISTING_FFP_OPERATOR_PASSWORD=$(sed -nE 's/^[[:space:]]*FFP_OPERATOR_PASSWORD=(.*)$/\1/p' .env | head -n 1 || true)
              grep -E '^STORE_[A-Z0-9_]+=' .env > "$EXISTING_STORE_ENV_FILE" || true
              grep -E '^[[:space:]]*(export[[:space:]]+)?(POSTGRES_DB|POSTGRES_USER|POSTGRES_PASSWORD|AUTO_SEO_DATABASE_URL|DATABASE_URL)[[:space:]]*=' .env > "$EXISTING_DATABASE_ENV_FILE" || true
              grep -E '^[[:space:]]*(export[[:space:]]+)?(SEO_PERFORMANCE_ENABLED|GSC_CLIENT_ID|GSC_CLIENT_SECRET|GSC_REDIRECT_URI|GSC_TOKEN_ENCRYPTION_KEY)[[:space:]]*=' .env > "$EXISTING_SEARCH_CONSOLE_ENV_FILE" || true
              grep -E '^[[:space:]]*(export[[:space:]]+)?(REVIEW_IMAGE_BRIDGE_TOKEN|REVIEW_IMAGE_EXTENSION_TOKEN|SHOPIFY_PIPELINE_TOKEN)[[:space:]]*=' .env > "$EXISTING_SERVICE_TOKEN_ENV_FILE" || true
              grep -E '^[[:space:]]*(export[[:space:]]+)?(META_ACCESS_TOKEN|META_PROXY_URL|SCRAPE_CREATORS_API_KEY|SCRAPECREATORS_API_KEY|SEARCHAPI_API_KEY|SEARCH_API_KEY|APIFY_TOKEN)[[:space:]]*=' .env > "$EXISTING_ADS_ENV_FILE" || true
            fi

            if [ -n "$ENV_B64" ]; then
              [ -f .env ] && cp .env .env.bak
              printf '%s' "$ENV_B64" | base64 -d > .env
            elif [ ! -f .env ]; then
              echo "No production .env exists. Copy .env.example to .env and configure required secrets." >&2
              exit 1
            fi

            if [ -s "$EXISTING_STORE_ENV_FILE" ]; then
              printf '\n' >> .env
              while IFS= read -r store_line; do
                store_key="${store_line%%=*}"
                if ! grep -q "^${store_key}=" .env; then
                  printf '%s\n' "$store_line" >> .env
                fi
              done < "$EXISTING_STORE_ENV_FILE"
            fi

            if [ -s "$EXISTING_ADS_ENV_FILE" ]; then
              printf '\n' >> .env
              while IFS= read -r ads_line; do
                ads_key="${ads_line%%=*}"
                if ! grep -q "^${ads_key}=" .env; then
                  printf '%s\n' "$ads_line" >> .env
                fi
              done < "$EXISTING_ADS_ENV_FILE"
            fi

            INCOMING_GPT_SEO_ACTION_KEYS_JSON=$(sed -nE 's/^[[:space:]]*GPT_SEO_ACTION_KEYS_JSON=(.*)$/\1/p' .env | head -n 1 || true)
            if [ -n "$EXISTING_GPT_SEO_ACTION_KEYS_JSON" ]; then
              sed -i '/^[[:space:]]*GPT_SEO_ACTION_KEYS_JSON=/d' .env
              printf '\nGPT_SEO_ACTION_KEYS_JSON=%s\n' "$EXISTING_GPT_SEO_ACTION_KEYS_JSON" >> .env
              INCOMING_GPT_SEO_ACTION_KEYS_JSON="$EXISTING_GPT_SEO_ACTION_KEYS_JSON"
            fi

            # Keep the VPS multi-store MCP keys authoritative for the same reason.
            INCOMING_GPT_SEO_MCP_KEYS_JSON=$(sed -nE 's/^[[:space:]]*GPT_SEO_MCP_KEYS_JSON=(.*)$/\1/p' .env | head -n 1 || true)
            if [ -n "$EXISTING_GPT_SEO_MCP_KEYS_JSON" ]; then
              sed -i '/^[[:space:]]*GPT_SEO_MCP_KEYS_JSON=/d' .env
              printf '\nGPT_SEO_MCP_KEYS_JSON=%s\n' "$EXISTING_GPT_SEO_MCP_KEYS_JSON" >> .env
              INCOMING_GPT_SEO_MCP_KEYS_JSON="$EXISTING_GPT_SEO_MCP_KEYS_JSON"
            fi

            # A multi-store map replaces the legacy single-store Action key.
            if [ -n "$INCOMING_GPT_SEO_ACTION_KEYS_JSON" ]; then
              sed -i '/^[[:space:]]*GPT_SEO_ACTION_KEY=/d' .env
            fi

            INCOMING_FFP_OPERATOR_USERNAME=$(sed -nE 's/^[[:space:]]*FFP_OPERATOR_USERNAME=(.*)$/\1/p' .env | head -n 1 || true)
            INCOMING_FFP_OPERATOR_PASSWORD=$(sed -nE 's/^[[:space:]]*FFP_OPERATOR_PASSWORD=(.*)$/\1/p' .env | head -n 1 || true)
            if [ -z "$INCOMING_FFP_OPERATOR_USERNAME" ] && [ -n "$EXISTING_FFP_OPERATOR_USERNAME" ]; then
              printf '\nFFP_OPERATOR_USERNAME=%s\n' "$EXISTING_FFP_OPERATOR_USERNAME" >> .env
              INCOMING_FFP_OPERATOR_USERNAME="$EXISTING_FFP_OPERATOR_USERNAME"
            fi
            if [ -z "$INCOMING_FFP_OPERATOR_PASSWORD" ] && [ -n "$EXISTING_FFP_OPERATOR_PASSWORD" ]; then
              printf '\nFFP_OPERATOR_PASSWORD=%s\n' "$EXISTING_FFP_OPERATOR_PASSWORD" >> .env
              INCOMING_FFP_OPERATOR_PASSWORD="$EXISTING_FFP_OPERATOR_PASSWORD"
            fi
            if { [ -n "$INCOMING_FFP_OPERATOR_USERNAME" ] && [ -z "$INCOMING_FFP_OPERATOR_PASSWORD" ]; } || { [ -z "$INCOMING_FFP_OPERATOR_USERNAME" ] && [ -n "$INCOMING_FFP_OPERATOR_PASSWORD" ]; }; then
              echo "FFP operator username and password must be configured together." >&2
              exit 1
            fi

            sed -i '/^[[:space:]]*CLIENT_PORT=/d' .env 2>/dev/null || true
            sed -i '/^[[:space:]]*CLIENT_BIND_ADDRESS=/d' .env 2>/dev/null || true
            sed -i '/^[[:space:]]*APP_PORT=/d' .env 2>/dev/null || true
            printf '\nCLIENT_PORT=%s\n' "$CLIENT_PORT" >> .env
            printf 'CLIENT_BIND_ADDRESS=127.0.0.1\n' >> .env
            python3 -c "import re; p=re.compile(r'^\s*(#|$|(export\s+)?[a-zA-Z_][a-zA-Z0-9_]*\s*=)'); lines=open('.env','r',encoding='utf-8',errors='replace').readlines(); open('.env','w',encoding='utf-8').writelines([line if p.match(line) else ('# [sanitized] ' + line) for line in lines])"
            chmod 600 .env
            POSTGRES_SETUP_ARGS=()
            if docker volume inspect ffp-tool_ffp_postgres_data > /dev/null 2>&1; then
              POSTGRES_SETUP_ARGS+=(--has-existing-volume)
            fi
            python3 scripts/prepare-production-postgres.py --env-file .env --previous-env-file "$EXISTING_DATABASE_ENV_FILE" "${POSTGRES_SETUP_ARGS[@]}"
            python3 scripts/prepare-production-search-console.py --env-file .env --previous-env-file "$EXISTING_SEARCH_CONSOLE_ENV_FILE" --redirect-uri "https://${TARGET_DOMAIN:-ffp.b6-team.site}/api/seo-performance/oauth/callback"
            python3 scripts/prepare-production-service-tokens.py --env-file .env --previous-env-file "$EXISTING_SERVICE_TOKEN_ENV_FILE"
            chmod 755 scripts/restart-gpt-seo.sh

            echo "=== [4/6] Validating and starting root Compose ==="
            SERVICES="$(docker compose config --services)"
            EXPECTED_SERVICES="$(printf 'database\nserver\nclient')"
            if [ "$SERVICES" != "$EXPECTED_SERVICES" ]; then
              echo "Unexpected production services:" >&2
              printf '%s\n' "$SERVICES" >&2
              exit 1
            fi
            docker compose config -q
            # Remove only the retired stateless container; its bind-mounted data remains on disk.
            docker rm -f ffp-tool-app >/dev/null 2>&1 || true
            if ! docker compose up -d --build --remove-orphans --wait --wait-timeout 180; then
              echo "Server or client failed to become healthy; printing bounded diagnostics." >&2
              docker compose ps || true
              docker compose logs --no-color --tail=200 server || true
              docker compose logs --no-color --tail=200 client || true
              exit 1
            fi

            echo "=== [5/6] Verifying host HTTPS reverse proxy ==="
            DOMAIN="${TARGET_DOMAIN:-ffp.b6-team.site}"
            NGINX_CONF="/etc/nginx/sites-available/$DOMAIN.conf"
            NGINX_ENABLED="/etc/nginx/sites-enabled/$DOMAIN.conf"
            if [ ! -f "$NGINX_CONF" ]; then
              if [ -f scripts/setup-vps-host.sh ]; then
                sudo bash scripts/setup-vps-host.sh "$DOMAIN" "$CLIENT_PORT"
              else
                sudo bash -c "printf '%s\n' \
                  'server {' \
                  '    listen 80;' \
                  '    listen [::]:80;' \
                  '    server_name $DOMAIN;' \
                  '    client_max_body_size 50M;' \
                  '    location / {' \
                  '        proxy_pass http://127.0.0.1:$CLIENT_PORT;' \
                  '        proxy_http_version 1.1;' \
                  '        proxy_set_header Upgrade \$http_upgrade;' \
                  '        proxy_set_header Connection \"upgrade\";' \
                  '        proxy_set_header Host \$host;' \
                  '        proxy_set_header X-Real-IP \$remote_addr;' \
                  '        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;' \
                  '        proxy_set_header X-Forwarded-Proto \$scheme;' \
                  '        proxy_connect_timeout 60s;' \
                  '        proxy_send_timeout 300s;' \
                  '        proxy_read_timeout 300s;' \
                  '    }' \
                  '}' > '$NGINX_CONF'"
                sudo ln -sf "$NGINX_CONF" "$NGINX_ENABLED"
                sudo nginx -t
                sudo systemctl reload nginx
              fi
            else
              if grep -q "proxy_pass http://127\.0\.0\.1:$CLIENT_PORT;" "$NGINX_CONF" 2>/dev/null; then
                echo "Nginx reverse proxy already configured on port $CLIENT_PORT (skipping reload)."
              else
                sudo sed -i -E "s#proxy_pass http://127\.0\.0\.1:[0-9]+;#proxy_pass http://127.0.0.1:$CLIENT_PORT;#" "$NGINX_CONF"
                sudo nginx -t
                sudo systemctl reload nginx
              fi
            fi
            if ! sudo grep -q "ssl_certificate" "$NGINX_CONF" 2>/dev/null; then
              sudo certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos --register-unsafely-without-email --redirect || {
                echo "Certbot reported a warning. Verify DNS for $DOMAIN." >&2
              }
            fi

            echo "=== [6/6] Verifying deployment ==="
            HEALTHY=false
            for i in $(seq 1 15); do
              if curl -s -f "http://127.0.0.1:$CLIENT_PORT/health" > /dev/null 2>&1; then
                HEALTHY=true
                break
              fi
              echo "Waiting for the client endpoint (attempt $i/15)..."
              sleep 2
            done
            if [ "$HEALTHY" = "false" ]; then
              docker compose logs --tail=50
              exit 1
            fi

            docker compose ps
            echo "FFP Tool deployment to https://$DOMAIN completed successfully."
