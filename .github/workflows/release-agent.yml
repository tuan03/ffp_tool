name: Release Windows Crawler Agent

on:
  push:
    tags:
      - "agent-v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Verify Agent source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/modules/amazon-crawler/engine/requirements.txt

      - name: Install check dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install -r src/modules/amazon-crawler/engine/requirements.txt

      - name: Run Agent checks
        run: |
          npm run typecheck
          npm run test:engine
          pwsh -NoProfile -File ./scripts/build-amazon-crawler-client.ps1 -SmokeTest

  build:
    name: Build and sign Windows ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release tag and agent version
        shell: pwsh
        run: |
          $versionLine = Select-String -LiteralPath "src/modules/amazon-crawler/engine/distributed/__init__.py" -Pattern '^AGENT_VERSION = "(\d+\.\d+\.\d+)"$'
          if ($null -eq $versionLine -or $versionLine.Matches.Count -ne 1) {
            throw "AGENT_VERSION must contain one stable semantic version."
          }
          $agentVersion = $versionLine.Matches[0].Groups[1].Value
          $tagVersion = "${{ github.ref_name }}" -replace '^agent-v', ''
          if ($agentVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match AGENT_VERSION $agentVersion."
          }

      - name: Build Windows portable Agent
        shell: pwsh
        run: ./scripts/build-amazon-crawler-client.ps1 -SkipInstaller

      - name: Verify packaged Agent startup without production connections
        shell: pwsh
        run: |
          & .runtime/agent-build/venv/Scripts/python.exe scripts/smoke-agent-zip.py artifacts/windows/FFPAmazonCrawlerAgent/FFPAmazonCrawlerAgent.exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Agent smoke test failed.' }

      - name: Sign and verify ZIP manifest
        shell: pwsh
        env:
          FFP_AGENT_RELEASE_PRIVATE_KEY: ${{ secrets.FFP_AGENT_RELEASE_PRIVATE_KEY }}
          FFP_AGENT_RELEASE_KEY_ID: ${{ vars.FFP_AGENT_RELEASE_KEY_ID }}
        run: |
          & .runtime/agent-build/venv/Scripts/python.exe scripts/publish-agent-zip.py --key-id "$env:FFP_AGENT_RELEASE_KEY_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Signed ZIP preparation failed.' }

      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: signed-agent-zip
          path: |
            installer-output/FFP-Amazon-Crawler-*-windows-x64.zip
            installer-output/FFP-Amazon-Crawler-*-windows-x64.zip.sha256
            installer-output/latest-zip.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Publish verified Windows ZIP
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: signed-agent-zip
          path: installer-output

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $agentVersion = "${{ github.ref_name }}" -replace '^agent-v', ''
          gh release create "${{ github.ref_name }}" `
            "installer-output/FFP-Amazon-Crawler-$agentVersion-windows-x64.zip" `
            "installer-output/FFP-Amazon-Crawler-$agentVersion-windows-x64.zip.sha256" `
            "installer-output/latest-zip.json" `
            --title "FFP Amazon Crawler ${{ github.ref_name }}" `
            --generate-notes `
            --draft `
            --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed.' }
          gh release edit "${{ github.ref_name }}" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
