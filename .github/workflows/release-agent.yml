name: Release Windows Crawler Agent

on:
  push:
    tags:
      - "agent-v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r src/modules/amazon-crawler/engine/requirements.txt

      - name: Validate release tag and agent version
        shell: pwsh
        run: |
          $versionLine = Select-String -LiteralPath "src/modules/amazon-crawler/engine/distributed/__init__.py" -Pattern '^AGENT_VERSION = "(\d+\.\d+\.\d+)"$'
          if ($null -eq $versionLine -or $versionLine.Matches.Count -ne 1) {
            throw "AGENT_VERSION must contain one stable semantic version."
          }
          $agentVersion = $versionLine.Matches[0].Groups[1].Value
          $tagVersion = "${{ github.ref_name }}" -replace '^agent-v', ''
          if ($agentVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match AGENT_VERSION $agentVersion."
          }

      - name: Run agent checks
        shell: pwsh
        run: |
          npm run typecheck
          npm run test:engine
          ./scripts/build-amazon-crawler-client.ps1 -SmokeTest

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-amazon-crawler-client.ps1

      # Provision an approved Authenticode signer before this gate. An unsigned
      # local build is useful for testing but must never become a public release.
      - name: Verify trusted signature and generate release manifest
        shell: pwsh
        env:
          AGENT_TRUSTED_SIGNERS: ${{ vars.AGENT_TRUSTED_SIGNERS }}
        run: |
          $agentVersion = "${{ github.ref_name }}" -replace '^agent-v', ''
          ./scripts/create-agent-release.ps1 -Version $agentVersion -TrustedSignerThumbprints ($env:AGENT_TRUSTED_SIGNERS -split ',')

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $agentVersion = "${{ github.ref_name }}" -replace '^agent-v', ''
          gh release create "${{ github.ref_name }}" `
            "installer-output/FFP-Amazon-Crawler-Setup-$agentVersion.exe" `
            "installer-output/FFP-Amazon-Crawler-Setup-$agentVersion.exe.sha256" `
            "installer-output/latest.json" `
            --title "FFP Amazon Crawler ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
