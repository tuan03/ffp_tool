name: Release Windows Crawler Agent

on:
  push:
    tags:
      - "agent-v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Windows ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JavaScript dependencies
        # The Agent release only needs TypeScript/Vite tooling. Gateway native
        # install hooks (notably better-sqlite3) are unrelated to this artifact
        # and make the Windows release runner depend on a C++ toolchain.
        run: npm ci --ignore-scripts

      - name: Install Python dependencies
        run: python -m pip install -r src/modules/amazon-crawler/engine/requirements.txt

      - name: Validate release tag and agent version
        shell: pwsh
        run: |
          $versionLine = Select-String -LiteralPath "src/modules/amazon-crawler/engine/distributed/__init__.py" -Pattern '^AGENT_VERSION = "(\d+\.\d+\.\d+)"$'
          if ($null -eq $versionLine -or $versionLine.Matches.Count -ne 1) {
            throw "AGENT_VERSION must contain one stable semantic version."
          }
          $agentVersion = $versionLine.Matches[0].Groups[1].Value
          $tagVersion = "${{ github.ref_name }}" -replace '^agent-v', ''
          if ($agentVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match AGENT_VERSION $agentVersion."
          }

      - name: Run agent checks
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Typecheck failed.' }
          npm run test:engine
          if ($LASTEXITCODE -ne 0) { throw 'Agent tests failed.' }
          ./scripts/build-amazon-crawler-client.ps1 -SmokeTest
          if ($LASTEXITCODE -ne 0) { throw 'Agent configuration smoke test failed.' }

      - name: Build Windows portable Agent
        shell: pwsh
        run: ./scripts/build-amazon-crawler-client.ps1 -SkipInstaller

      - name: Verify packaged Agent startup without production connections
        shell: pwsh
        run: |
          python scripts/smoke-agent-zip.py artifacts/windows/FFPAmazonCrawlerAgent/FFPAmazonCrawlerAgent.exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Agent smoke test failed.' }

      - name: Sign and verify ZIP manifest
        shell: pwsh
        env:
          FFP_AGENT_RELEASE_PRIVATE_KEY: ${{ secrets.FFP_AGENT_RELEASE_PRIVATE_KEY }}
          FFP_AGENT_RELEASE_KEY_ID: ${{ vars.FFP_AGENT_RELEASE_KEY_ID }}
        run: |
          python scripts/publish-agent-zip.py --key-id "$env:FFP_AGENT_RELEASE_KEY_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Signed ZIP preparation failed.' }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $agentVersion = "${{ github.ref_name }}" -replace '^agent-v', ''
          gh release create "${{ github.ref_name }}" `
            "installer-output/FFP-Amazon-Crawler-$agentVersion-windows-x64.zip" `
            "installer-output/FFP-Amazon-Crawler-$agentVersion-windows-x64.zip.sha256" `
            "installer-output/latest-zip.json" `
            --title "FFP Amazon Crawler ${{ github.ref_name }}" `
            --generate-notes `
            --draft `
            --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed.' }
          gh release edit "${{ github.ref_name }}" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
