# ==============================================================================
# FFP Tool - 3-Container Unified Architecture
# Run entire application with 1 single command:
#   docker compose up -d --build
#
# Containers:
#   1. database: PostgreSQL 17 (Unified database for all modules)
#   2. server:   Unified Backend (Gateway, Crawler Coordinator, Pipeline Worker)
#   3. client:   Frontend Web Client (React SPA UI + Nginx Reverse Proxy)
# ==============================================================================

name: ffp-tool

services:
  # ----------------------------------------------------------------------------
  # 1. DATABASE CONTAINER
  # ----------------------------------------------------------------------------
  database:
    image: postgres:17-alpine
    container_name: ffp-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ffp_tool}
      POSTGRES_USER: ${POSTGRES_USER:-ffp_tool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ffp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ffp_tool} -d ${POSTGRES_DB:-ffp_tool}"]
      interval: 5s
      timeout: 5s
      retries: 10
    cpus: "${DATABASE_CPUS:-1.0}"
    mem_limit: ${DATABASE_MEMORY_LIMIT:-1g}
    pids_limit: ${DATABASE_PIDS_LIMIT:-200}
    logging:
      driver: "json-file"
      options:
        max-size: "${DATABASE_LOG_MAX_SIZE:-10m}"
        max-file: "${DATABASE_LOG_MAX_FILES:-3}"

  # ----------------------------------------------------------------------------
  # 2. SERVER CONTAINER (Unified Backend for All Modules)
  # ----------------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: deploy/server/Dockerfile
    container_name: ffp-server
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-ffp_tool}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-ffp_tool}}
      AUTO_SEO_DATABASE_URL: ${AUTO_SEO_DATABASE_URL:-postgresql://${POSTGRES_USER:-ffp_tool}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-ffp_tool}}
      AMAZON_COORDINATOR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ffp_tool}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-ffp_tool}
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 3001
      COORDINATOR_PORT: 8766
      REVIEW_IMAGE_BRIDGE_URL: http://127.0.0.1:8766
      REVIEW_IMAGE_RUNTIME_ROOT: /app/.runtime/review-image
      REVIEW_IMAGE_OUTPUT_DIR: /app/.runtime/review-image/outputs
      REVIEW_IMAGE_DURABLE_UPLOADS: "true"
      START_PIPELINE_WORKER: ${START_PIPELINE_WORKER:-true}
      SHOPIFY_GATEWAY_URL: http://127.0.0.1:3001/api/shopify
      SHOPIFY_PIPELINE_COORDINATOR_URL: http://127.0.0.1:8766
      PINTEREST_POD_HOST: 0.0.0.0
      PINTEREST_POD_PORT: 8768
      PINTEREST_COORDINATOR_URL: http://127.0.0.1:8766
      PINTEREST_RUNTIME_ROOT: /app/.runtime/pinterest-pod
      TREND_PRODUCT_OUTPUT: /app/.runtime/pinterest-pod/output
      PINTEREST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ffp_tool}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-ffp_tool}
      PINTEREST_APP_ID: ${PINTEREST_APP_ID:-}
      PINTEREST_APP_SECRET: ${PINTEREST_APP_SECRET:-}
      PINTEREST_REDIRECT_URI: ${PINTEREST_REDIRECT_URI:-http://localhost:3010/api/pinterest-pod/oauth/callback}
      PINTEREST_OAUTH_STATE_SECRET: ${PINTEREST_OAUTH_STATE_SECRET:-}
      PINTEREST_SCOPES: ${PINTEREST_SCOPES:-user_accounts:read,boards:read,pins:read,ads:read}
    volumes:
      - ffp_data:/app/.local-data
      - ffp_runtime:/app/.runtime
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/health >/dev/null && curl -fsS http://127.0.0.1:8766/api/v1/ready >/dev/null && curl -fsS http://127.0.0.1:8768/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    cpus: "${SERVER_CPUS:-2.0}"
    mem_limit: ${SERVER_MEMORY_LIMIT:-3g}
    pids_limit: ${SERVER_PIDS_LIMIT:-512}
    logging:
      driver: "json-file"
      options:
        max-size: "${SERVER_LOG_MAX_SIZE:-10m}"
        max-file: "${SERVER_LOG_MAX_FILES:-3}"

  # ----------------------------------------------------------------------------
  # 3. CLIENT CONTAINER (Frontend Web Client & Nginx Proxy)
  # ----------------------------------------------------------------------------
  client:
    build:
      context: .
      dockerfile: deploy/client/Dockerfile
      args:
        VITE_AGENT_INSTALL_URL: ${VITE_AGENT_INSTALL_URL:-https://ffp.b6-team.site}
    container_name: ffp-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      FFP_OPERATOR_USERNAME: ${FFP_OPERATOR_USERNAME:?Set FFP_OPERATOR_USERNAME in .env}
      FFP_OPERATOR_PASSWORD: ${FFP_OPERATOR_PASSWORD:?Set FFP_OPERATOR_PASSWORD in .env}
    ports:
      - "${CLIENT_BIND_ADDRESS:-0.0.0.0}:${CLIENT_PORT:-3010}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    cpus: "${CLIENT_CPUS:-0.5}"
    mem_limit: ${CLIENT_MEMORY_LIMIT:-256m}
    pids_limit: ${CLIENT_PIDS_LIMIT:-100}
    logging:
      driver: "json-file"
      options:
        max-size: "${CLIENT_LOG_MAX_SIZE:-10m}"
        max-file: "${CLIENT_LOG_MAX_FILES:-3}"

volumes:
  ffp_postgres_data:
  ffp_data:
  ffp_runtime:
